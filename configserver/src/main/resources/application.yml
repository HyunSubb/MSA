server:
  port: 8888 # 보통 config server는 8888 포트를 많이 사용한다.

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: gks00dlfz@
  cloud:
    config:
      server:
        git:
          uri: https://github.com/HyunSubb/spring_cloud_configs.git
          clone-on-start: true # 깃허브와 sync를 맞춘다는 설정
          default-label: main # 어느 branch를 바라볼거냐라는 설정
#          만약 private repo 일 경우에는 username과 pw를 작어줘야 한다.
#          username: github 사용자의 이름
#          password: 토큰값
    bus:
      enable: true

# actuator 관련 설정. 어떤 엔드포인트를 사용할지에 대한 설정
management:
  endpoints:
    web:
      exposure:
#        config 서버가 제공해주는 endpoint이다. busrefresh를 통해 실시간 config 정보 갱신이 가능하다.
        include: busrefresh, health # env, info, refresh 등도 활용이 가능하다.