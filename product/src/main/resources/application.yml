eureka:
  client:
    serviceUrl:
      # 유레카 서버가 어디에 있는지를 위치 정보를 여기다가 명시해 둔 것이다.
      defaultZone: http://localhost:8761/eureka/

server:
  # port를 0으로 세팅을 하면 spring이 임의 port를 할당한다.
  # port 번호가 임의여도 유레카한테 서비스의 이름으로 물어보고 찾는 것이기 때문에 상관없다.
  port: 0

spring :
  application:
    # Eureka한테 나의 이름을 알려주기 위해 이름 설정
    name: product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ordermsa?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: yourpassword
  jpa:
    database: mysql
    #    InnoDB??
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  kafka:
      kafka-server: localhost:9092 # 9092는 kafka서버의 포트번호이다.
      consumer:
#       groupid는 컨슈머 그룹을 식별하는 ID로서, 동일한 그룹ID를 가진 컨슈머들은 메시지를 분담해서 consume한다.
#       만약 여러 컨슈머가 다른 group-id를 가지고 한 topic을 listen하면 각기 메시지를 수신하여 메시지 전파 효과 발생
        group-id: product-group
#       카프카내에 들어와있는 메시지 중에 처음들어와 있는 메시지부터 읽기 시작.
#       (latest라는 것도 있는데 얘는 현 시점 이후에 들어오는 메시지만 읽는다.)
        auto-offset-reset: earliest

